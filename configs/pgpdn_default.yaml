model:
  name: PG-PDN
  input_dim: 12
  residual_input_dim: 8
  gru_hidden_dim: 16
  gru_layers: 1
  dropout: 0.1
  pqi_scale: 100.0

physical_branch:
  parameter_clip_ratio: 0.5
  initial_parameters:
    alpha0: 0.008
    alpha1: 0.012
    alpha2: 0.00020
    alpha3: 0.0010
    alpha4: 0.0030
    beta1: 0.0050
    beta2: 0.0040
    beta3: 0.0120
    beta4: 0.0150
    gamma: 0.0100

loss:
  lambda_neg: 0.5
  lambda_smooth: 0.1

public_release:
  includes_processed_route_quality_json: true
  includes_precomputed_pgpdn_outputs: true
  includes_web_demo: true
  includes_feature_schema: true
  includes_synthetic_demo_records: true
