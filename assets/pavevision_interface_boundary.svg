<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PaveVision interface boundary</title>
  <desc id="desc">A method schematic of the boundary between PG-PDN method code and a PaveVision interface layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#364152" />
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #182230; }
      .label { font: 700 18px Arial, sans-serif; fill: #182230; }
      .text { font: 14px Arial, sans-serif; fill: #364152; }
      .small { font: 12px Arial, sans-serif; fill: #4b5565; }
      .method { fill: #ecfdf3; stroke: #17b26a; stroke-width: 2; rx: 14; }
      .contract { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }
      .ui { fill: #f4f3ff; stroke: #7a5af8; stroke-width: 2; rx: 14; }
      .line { stroke: #364152; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="50" y="48" class="title">PaveVision interface boundary</text>
  <text x="50" y="76" class="text">The PG-PDN method layer defines named outputs; the interface layer consumes labels and tensors.</text>

  <rect x="70" y="125" width="285" height="185" class="method"/>
  <text x="100" y="160" class="label">PG-PDN method layer</text>
  <text x="100" y="195" class="text">PhysicalBranch</text>
  <text x="100" y="220" class="text">PGPDN</text>
  <text x="100" y="245" class="text">PGPDNLoss</text>
  <text x="100" y="278" class="small">source: pgpdn/model.py</text>

  <rect x="465" y="105" width="280" height="225" class="contract"/>
  <text x="495" y="140" class="label">Named output contract</text>
  <text x="495" y="175" class="text">delta_norm</text>
  <text x="495" y="200" class="text">delta_pqi_points</text>
  <text x="495" y="225" class="text">next_pqi_points</text>
  <text x="495" y="250" class="text">physical_delta_norm</text>
  <text x="495" y="275" class="text">residual_delta_norm</text>
  <text x="495" y="306" class="small">source: pavevision_ui/interface_contract.md</text>

  <rect x="855" y="125" width="275" height="185" class="ui"/>
  <text x="885" y="160" class="label">PaveVision UI layer</text>
  <text x="885" y="195" class="text">quality labels</text>
  <text x="885" y="220" class="text">prediction labels</text>
  <text x="885" y="245" class="text">branch attribution</text>
  <text x="885" y="278" class="small">source: pavevision_ui/</text>

  <path class="line" d="M356 218 L463 218"/>
  <path class="line" d="M746 218 L853 218"/>
  <text x="380" y="202" class="small">method outputs</text>
  <text x="768" y="202" class="small">presentation fields</text>
</svg>
